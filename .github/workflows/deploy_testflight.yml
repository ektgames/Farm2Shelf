name: Farm2Shelf iOS TestFlight CI/CD

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS Build Number'
        required: false
        default: ''

jobs:
  build-and-deploy-ios:
    name: Build iOS Xcode Project & Deploy to TestFlight
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      # 1. Repository Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Xcode Environment Setup & Verification
      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Verify Xcode & iOS SDK Environment
        run: |
          echo "=== Xcode Environment Information ==="
          DEVELOPER_DIR=$(xcode-select -p)
          echo "Developer Directory: $DEVELOPER_DIR"
          xcodebuild -version
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK Version:     $SDK_VER"
          echo "====================================="

          SDK_MAJOR=$(echo "$SDK_VER" | cut -d. -f1)
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "❌ ERROR: iOS SDK version ($SDK_VER) is less than required iOS 26 SDK!"
            echo "App Store Connect requires iOS 26 SDK or later, included in Xcode 26 or later."
            exit 1
          fi

      # 3. Unity Library Cache
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      # 4. GameCI Unity iOS Build (Xcode Project Export)
      - name: Unity iOS Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.4.9f1
          buildMethod: Farm2Shelf.Editor.iOSBuildScript.BuildForiOS
          buildPath: build
          customParameters: -buildNumber ${{ github.event.inputs.build_number || github.run_number }}

      # 5. Diagnostic Directory Listing
      - name: Diagnostic Directory Listing
        run: |
          echo "=== Directory Listing under build/ ==="
          if [ -d "build" ]; then
            find build -maxdepth 6 | sort
          else
            echo "Directory build does not exist in root."
          fi
          echo "======================================"

      # 6. Verify Unity Output Xcode Project Structure
      - name: Verify Exported Xcode Project
        run: |
          PBXPROJ_FILE=$(find build -name "project.pbxproj" | head -n 1)
          if [ -z "$PBXPROJ_FILE" ] || [ ! -f "$PBXPROJ_FILE" ]; then
            echo "❌ ERROR: Unity build failed to export project.pbxproj anywhere under build/"
            exit 1
          fi
          XCODE_PROJ_DIR=$(dirname $(dirname "$PBXPROJ_FILE"))
          echo "✅ Verified exported Xcode project structure at $XCODE_PROJ_DIR"

          # Verify AppIcon Asset Catalog (AppIcon.appiconset & Contents.json)
          APPICON_SET=$(find build -name "AppIcon.appiconset" -type d | head -n 1)
          if [ -z "$APPICON_SET" ] || [ ! -d "$APPICON_SET" ]; then
            echo "❌ ERROR: AppIcon.appiconset directory not found in exported Xcode project!"
            exit 1
          fi

          CONTENTS_JSON="$APPICON_SET/Contents.json"
          if [ ! -f "$CONTENTS_JSON" ]; then
            echo "❌ ERROR: Contents.json not found inside $APPICON_SET"
            exit 1
          fi

          echo "=== AppIcon.appiconset Inspection ==="
          echo "Location: $APPICON_SET"
          cat "$CONTENTS_JSON"
          echo "====================================="

          # Parse Contents.json for 1024x1024 / ios-marketing icon filename
          ICON_FILENAME=$(python3 -c "
import json, sys
try:
    with open('$CONTENTS_JSON') as f:
        data = json.load(f)
    for img in data.get('images', []):
        if img.get('idiom') == 'ios-marketing' or img.get('size') == '1024x1024':
            fn = img.get('filename')
            if fn:
                print(fn)
                sys.exit(0)
except Exception:
    pass
sys.exit(1)
" || echo "")

          if [ -z "$ICON_FILENAME" ]; then
            echo "❌ ERROR: 1024x1024 / ios-marketing App Store icon filename entry is missing or empty in $CONTENTS_JSON!"
            exit 1
          fi

          ICON_FILE_PATH="$APPICON_SET/$ICON_FILENAME"
          if [ ! -f "$ICON_FILE_PATH" ]; then
            echo "❌ ERROR: Referenced 1024x1024 marketing icon file ($ICON_FILENAME) does not exist at $ICON_FILE_PATH!"
            exit 1
          fi

          # Verify the referenced icon is a valid 1024x1024 PNG image
          FILE_TYPE=$(file -b "$ICON_FILE_PATH" || echo "")
          echo "Referenced marketing icon file type: $FILE_TYPE"

          if ! echo "$FILE_TYPE" | grep -qi "PNG"; then
            echo "❌ ERROR: Referenced marketing icon file ($ICON_FILE_PATH) is not a PNG image (type: $FILE_TYPE)!"
            exit 1
          fi

          DIMENSIONS=$(python3 -c "
import struct, sys
try:
    with open('$ICON_FILE_PATH', 'rb') as f:
        header = f.read(24)
        if header[:8] == b'\x89PNG\r\n\x1a\n':
            w, h = struct.unpack('>II', header[16:24])
            print(f'{w}x{h}')
            sys.exit(0)
except Exception:
    pass
sys.exit(1)
" || echo "")

          echo "Referenced marketing icon dimensions: $DIMENSIONS"

          if [ "$DIMENSIONS" != "1024x1024" ]; then
            echo "❌ ERROR: Referenced marketing icon dimensions ($DIMENSIONS) do not match required 1024x1024!"
            exit 1
          fi

          echo "✅ Verified 1024x1024 App Store Marketing icon PNG ($ICON_FILENAME) dimensions ($DIMENSIONS)!"

      # 7. Apple Certificate & Provisioning Profile Installation
      - name: Install Apple Certificate & Provisioning Profile
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          echo "Setting up temporary Keychain for signing..."
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          
          # Locate OpenSSL 3 binary on macOS runner (Apple Silicon or Intel path)
          OPENSSL_BIN=""
          if [ -x "/opt/homebrew/opt/openssl@3/bin/openssl" ]; then
            OPENSSL_BIN="/opt/homebrew/opt/openssl@3/bin/openssl"
          elif [ -x "/usr/local/opt/openssl@3/bin/openssl" ]; then
            OPENSSL_BIN="/usr/local/opt/openssl@3/bin/openssl"
          elif command -v brew >/dev/null 2>&1; then
            BREW_OPENSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
            if [ -x "$BREW_OPENSSL" ]; then
              OPENSSL_BIN="$BREW_OPENSSL"
            fi
          fi

          if [ -z "$OPENSSL_BIN" ]; then
            echo "Installing openssl@3 via brew..."
            brew install openssl@3
            OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          fi

          if [ ! -x "$OPENSSL_BIN" ]; then
            echo "ERROR: OpenSSL 3 binary was not found at $OPENSSL_BIN"
            exit 1
          fi

          echo "Using OpenSSL 3 binary at: $OPENSSL_BIN"
          "$OPENSSL_BIN" version

          # Decode and import P12 certificate
          P12_RAW_PATH=$RUNNER_TEMP/certificate_raw.p12
          P12_LEGACY_PATH=$RUNNER_TEMP/certificate_legacy.p12
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$P12_RAW_PATH"
          
          if ! security import "$P12_RAW_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASS" -T /usr/bin/codesign -T /usr/bin/productsign 2>/dev/null; then
            echo "Modern PKCS12 format detected, converting to Apple legacy format via OpenSSL 3..."
            "$OPENSSL_BIN" pkcs12 -in "$P12_RAW_PATH" -passin pass:"$APPLE_CERTIFICATE_PASS" -out "$RUNNER_TEMP/cert_temp.pem" -nodes -passout pass:""
            "$OPENSSL_BIN" pkcs12 -export -in "$RUNNER_TEMP/cert_temp.pem" -out "$P12_LEGACY_PATH" -passout pass:"$APPLE_CERTIFICATE_PASS" -legacy
            security import "$P12_LEGACY_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASS" -T /usr/bin/codesign -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/cert_temp.pem" "$P12_LEGACY_PATH"
          fi
          rm -f "$P12_RAW_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          
          echo "Installed Signing Identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Provisioning Profile installation
          PP_PATH=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_PATH"
          PP_FILE="$PP_PATH/Farm2Shelf_GitHub_Actions.mobileprovision"
          echo "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_FILE"
          
          echo "Parsing Provisioning Profile metadata..."
          security cms -D -i "$PP_FILE" > "$RUNNER_TEMP/pp.plist"
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/pp.plist" 2>/dev/null || echo "Unknown")
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/pp.plist" 2>/dev/null || echo "Unknown")
          PP_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/pp.plist" 2>/dev/null || echo "Unknown")
          
          echo " - Profile Name: $PP_NAME"
          echo " - Profile UUID: $PP_UUID"
          echo " - Team ID:     $PP_TEAM"

      # 8. Xcode Archive & Export IPA
      - name: Build Xcode Archive & Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          XCODE_PROJ_PATH=$(find build -name "Unity-iPhone.xcodeproj" | head -n 1)
          if [ -z "$XCODE_PROJ_PATH" ]; then
            echo "❌ ERROR: Unity-iPhone.xcodeproj not found under build/"
            exit 1
          fi

          XCODE_BASE_DIR=$(dirname "$XCODE_PROJ_PATH")
          ARCHIVE_PATH="$XCODE_BASE_DIR/Farm2Shelf.xcarchive"
          EXPORT_OPTIONS_PATH="$XCODE_BASE_DIR/ExportOptions.plist"
          OUTPUT_PATH="$XCODE_BASE_DIR/output"
          
          mkdir -p "$OUTPUT_PATH"

          # Create ExportOptions.plist
          cat <<EOF > "$EXPORT_OPTIONS_PATH"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.ektgames.farm2shelf</key>
                  <string>Farm2Shelf GitHub Actions</string>
              </dict>
          </dict>
          </plist>
          EOF

          echo "Building Xcode Archive..."
          xcodebuild -project "$XCODE_PROJ_PATH" \
                     -scheme Unity-iPhone \
                     -configuration Release \
                     -archivePath "$ARCHIVE_PATH" \
                     archive \
                     DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
                     CODE_SIGN_STYLE="Manual" \
                     PROVISIONING_PROFILE_SPECIFIER_APP="Farm2Shelf GitHub Actions" \
                     CODE_SIGN_IDENTITY="Apple Distribution"

          echo "Exporting IPA package..."
          xcodebuild -exportArchive \
                     -archivePath "$ARCHIVE_PATH" \
                     -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
                     -exportPath "$OUTPUT_PATH"

      # 9. Inspect & Validate Exported IPA
      - name: Inspect & Validate IPA
        env:
          EXPECTED_BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: |
          set -e
          IPA_PATH=$(find build -name "*.ipa" | head -n 1)
          
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "❌ ERROR: No IPA file found under build/"
            exit 1
          fi

          echo "Found IPA file at: $IPA_PATH"
          
          # Unzip and inspect Payload Info.plist
          INSPECT_DIR=$RUNNER_TEMP/ipa_inspect
          rm -rf "$INSPECT_DIR"
          mkdir -p "$INSPECT_DIR"
          unzip -q "$IPA_PATH" -d "$INSPECT_DIR"
          
          APP_BUNDLE=$(find "$INSPECT_DIR/Payload" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "❌ ERROR: No .app bundle found directly under Payload/!"
            echo "Payload directory contents:"
            ls -la "$INSPECT_DIR/Payload" || true
            exit 1
          fi

          INFO_PLIST="$APP_BUNDLE/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "❌ ERROR: Info.plist not found at expected path: $INFO_PLIST"
            echo "App bundle contents:"
            ls -la "$APP_BUNDLE" || true
            exit 1
          fi

          echo "Inspecting App bundle Info.plist at: $INFO_PLIST"
          
          IPA_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST" 2>/dev/null || echo "")
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST" 2>/dev/null || echo "")
          IPA_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST" 2>/dev/null || echo "")
          
          echo "=== IPA Inspection Details ==="
          echo " - App Bundle:        $(basename "$APP_BUNDLE")"
          echo " - Bundle Identifier: $IPA_BUNDLE_ID"
          echo " - Short Version:     $IPA_VERSION"
          echo " - Build Number:      $IPA_BUILD"
          echo "=============================="

          if [ -z "$IPA_BUNDLE_ID" ]; then
            echo "❌ ERROR: Failed to read CFBundleIdentifier from $INFO_PLIST"
            exit 1
          fi

          if [ "$IPA_BUNDLE_ID" != "com.ektgames.farm2shelf" ]; then
            echo "❌ ERROR: IPA Bundle Identifier ($IPA_BUNDLE_ID) does not match expected com.ektgames.farm2shelf"
            exit 1
          fi

          EXPECTED_VERSION="0.1.0"
          if [ "$IPA_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ ERROR: IPA Short Version ($IPA_VERSION) does not match expected $EXPECTED_VERSION"
            exit 1
          fi

          if [ "$IPA_BUILD" != "$EXPECTED_BUILD_NUMBER" ]; then
            echo "❌ ERROR: IPA Build Number ($IPA_BUILD) does not match expected $EXPECTED_BUILD_NUMBER"
            exit 1
          fi

          echo "✅ All IPA validations passed successfully!"

      # 10. Upload IPA to App Store Connect / TestFlight
      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -e
          IPA_PATH=$(find build -name "*.ipa" | head -n 1)
          
          # Securely write API Key .p8 file
          API_KEY_DIR=~/.private_keys
          mkdir -p "$API_KEY_DIR"
          API_KEY_FILE="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_KEY_CONTENT" > "$API_KEY_FILE"

          echo "Uploading IPA to App Store Connect / TestFlight via xcrun altool..."
          xcrun altool --upload-app \
                       -f "$IPA_PATH" \
                       --type ios \
                       --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
                       --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          echo "✅ IPA Upload completed successfully!"

      # 11. Post-Job Clean Up
      - name: Clean Up Temporary Credentials & Keys
        if: always()
        run: |
          echo "Cleaning up temporary keychain and certificate files..."
          security delete-keychain $RUNNER_TEMP/build.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/Farm2Shelf_GitHub_Actions.mobileprovision
          rm -rf ~/.private_keys/AuthKey_*.p8
          rm -rf $RUNNER_TEMP/ipa_inspect
          echo "Clean up completed."
